<!doctype html>
<html><head><meta charset="utf-8"><title>mock claude / le chat</title></head>
<body>
  <!-- Different markup from ChatGPT on purpose: ProseMirror editor without id, aria-label send button,
       messages without data-message-author-role. Exercises the site-agnostic fallbacks. -->
  <main>
    <div id="conversation"></div>
  </main>
  <div class="composer">
    <fieldset>
      <div class="ProseMirror" contenteditable="true" aria-label="Écrire un message" style="border:1px solid #999;min-height:40px;padding:6px"><p></p></div>
      <button type="button" aria-label="Envoyer le message">↑</button>
    </fieldset>
  </div>
  <script>
    window.__sent = [];
    const input = document.querySelector(".ProseMirror");
    const conv = document.getElementById("conversation");
    function send() {
      const text = input.innerText.trim();
      if (!text) return;
      window.__sent.push(text);
      const u = document.createElement("div"); u.className = "user-turn"; u.textContent = text; conv.appendChild(u);
      input.innerHTML = "<p></p>";
      const a = document.createElement("div"); a.className = "assistant-turn"; conv.appendChild(a);
      const reply = "Bien reçu : " + text;
      let i = 0;
      const iv = setInterval(() => { i += 9; a.textContent = reply.slice(0, i); if (i >= reply.length) clearInterval(iv); }, 10);
    }
    document.querySelector('button[aria-label="Envoyer le message"]').addEventListener("click", send);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  </script>
</body></html>
